<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 192 48" fill="none">
  <!-- Símbolo: ח (het) estilizado -->
  <!-- Pilar esquerdo -->
  <line x1="6"  y1="40" x2="6"  y2="10" stroke="#b8922a" stroke-width="3.5" stroke-linecap="round"/>
  <!-- Pilar direito -->
  <line x1="28" y1="40" x2="28" y2="10" stroke="#b8922a" stroke-width="3.5" stroke-linecap="round"/>
  <!-- Barra superior — com pequena lacuna central (tradicional no ח) -->
  <line x1="6"  y1="10" x2="17" y2="10" stroke="#b8922a" stroke-width="3.5" stroke-linecap="round"/>
  <line x1="21" y1="10" x2="28" y2="10" stroke="#b8922a" stroke-width="3.2" stroke-linecap="round" opacity="0.55"/>

  <!-- Wordmark: Hokmá -->
  <text
    x="44" y="36"
    font-family="'EB Garamond', Georgia, 'Times New Roman', serif"
    font-size="30"
    font-weight="500"
    letter-spacing="-0.3"
    fill="#ede8df"
  >Hokm<tspan fill="#b8922a">á</tspan></text>
</svg>
