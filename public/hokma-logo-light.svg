  <!-- Símbolo ח — pilar esquerdo -->
  <line x1="48" y1="88" x2="48" y2="32" stroke="#b8922a" stroke-width="7" stroke-linecap="round"/>
  <!-- Pilar direito -->
  <line x1="84" y1="88" x2="84" y2="32" stroke="#b8922a" stroke-width="7" stroke-linecap="round"/>
